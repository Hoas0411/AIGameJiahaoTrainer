<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#14212b"/><g font-family="Microsoft YaHei" fill="#eef3f5"><text x="40" y="50" font-size="28">后墙端部局部修理 · 建模前接口图</text><text x="40" y="87" font-size="19">仅后墙四块 W01 派生件；左右侧墙、角件、前墙、地板、灯光、机位保持原值</text><text x="40" y="136" font-size="22">后立面：4 × 8.303 m，原高 10 m；三个内部拼接点</text><path d="M80 445 L80 265 L95 265 L118 180 L404 180 L404 445Z" fill="#64727c" stroke="#e4ebee" stroke-width="2"/><path d="M80 445 L80 265 L95 265 L118 180 L80 180Z" fill="#db9c3d"/><path d="M80 355 H404 M80 266 H404" stroke="#a8c1cf" stroke-width="3"/><rect x="150" y="203" width="180" height="15" fill="#23485f"/><rect x="135" y="290" width="195" height="15" fill="#23485f"/><text x="178" y="477" font-size="20">Rear_0</text><path d="M405 445 L405 265 L420 265 L443 180 L729 180 L729 445Z" fill="#64727c" stroke="#e4ebee" stroke-width="2"/><path d="M405 445 L405 265 L420 265 L443 180 L405 180Z" fill="#db9c3d"/><path d="M405 355 H729 M405 266 H729" stroke="#a8c1cf" stroke-width="3"/><rect x="475" y="203" width="180" height="15" fill="#23485f"/><rect x="460" y="290" width="195" height="15" fill="#23485f"/><text x="503" y="477" font-size="20">Rear_1</text><path d="M730 445 L730 265 L745 265 L768 180 L1054 180 L1054 445Z" fill="#64727c" stroke="#e4ebee" stroke-width="2"/><path d="M730 445 L730 265 L745 265 L768 180 L730 180Z" fill="#db9c3d"/><path d="M730 355 H1054 M730 266 H1054" stroke="#a8c1cf" stroke-width="3"/><rect x="800" y="203" width="180" height="15" fill="#23485f"/><rect x="785" y="290" width="195" height="15" fill="#23485f"/><text x="828" y="477" font-size="20">Rear_2</text><path d="M1055 445 L1055 265 L1070 265 L1093 180 L1379 180 L1379 445Z" fill="#64727c" stroke="#e4ebee" stroke-width="2"/><path d="M1055 445 L1055 265 L1070 265 L1093 180 L1055 180Z" fill="#db9c3d"/><path d="M1055 355 H1379 M1055 266 H1379" stroke="#a8c1cf" stroke-width="3"/><rect x="1125" y="203" width="180" height="15" fill="#23485f"/><rect x="1110" y="290" width="195" height="15" fill="#23485f"/><text x="1153" y="477" font-size="20">Rear_3</text><text x="50" y="525" font-size="19" fill="#ffbe5b">橙色：原左端收窄区补齐；相邻原右框深槽追加局部闭合实体（上层宽1.25m）；原主体顶点不移动</text><text x="50" y="562" font-size="18">上层 9.5m 处实测左端退让约 0.659m；原包围盒接触不等于该层墙皮接触</text><text x="50" y="615" font-size="22">剖面与施工约束</text><text x="50" y="659" font-size="19">补体沿原墙退台深度变化，保留台阶与坡面，端面止于 ±4.151722m 的拼接平面。</text><text x="50" y="700" font-size="19">闭合接口有真实侧壁与背面；新增正面沿原生 PBR 采样，避免平涂补丁。</text><text x="50" y="741" font-size="19">不缩短间距、不拉伸主体、不改窗户；近景核查端部和掠射视角的闪烁。</text><text x="50" y="800" font-size="18">立面为接口施工示意，深度轮廓以 measured_sections.json 和 Blender 实测光线断面为准。</text></g></svg>