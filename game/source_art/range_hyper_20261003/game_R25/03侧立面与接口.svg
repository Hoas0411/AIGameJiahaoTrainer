<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#edf2f5"/><style>text{font:18px sans-serif;fill:#193344} .panel{fill:#6f818c;stroke:#203747;stroke-width:1} .glass{fill:#a0dbe9;stroke:#326376} .lamp{stroke:#f0c887;stroke-width:4}</style><text x="30" y="35">R25施工图03：侧立面和接口规范</text><rect x="70.0" y="240" width="131.92384262083198" height="258.75" class="panel"/><rect x="70.0" y="182.5" width="131.92384262083198" height="57.49999999999999" class="panel"/><rect x="201.92384262083198" y="240" width="131.92384262083198" height="258.75" class="panel"/><rect x="201.92384262083198" y="182.5" width="131.92384262083198" height="57.49999999999999" class="panel"/><rect x="333.84768524166395" y="240" width="131.92384262083198" height="258.75" class="panel"/><rect x="333.84768524166395" y="182.5" width="131.92384262083198" height="57.49999999999999" class="panel"/><rect x="465.77152786249593" y="240" width="131.92384262083198" height="258.75" class="panel"/><rect x="465.77152786249593" y="182.5" width="131.92384262083198" height="57.49999999999999" class="panel"/><rect x="597.6953704833279" y="240" width="131.92384262083198" height="258.75" class="panel"/><rect x="597.6953704833279" y="182.5" width="131.92384262083198" height="57.49999999999999" class="panel"/><rect x="729.6192131041598" y="240" width="131.92384262083198" height="258.75" class="panel"/><rect x="729.6192131041598" y="182.5" width="131.92384262083198" height="57.49999999999999" class="panel"/><rect x="861.5430557249919" y="240" width="131.92384262083198" height="258.75" class="panel"/><rect x="861.5430557249919" y="182.5" width="131.92384262083198" height="57.49999999999999" class="panel"/><text x="40" y="600">侧立面：7跨原M01，柱脚凹墙保持，窗口仅精确切分后侧遮挡，原顶点不移；上部独立板实例填充</text><text x="40" y="640">接口：M04端面对齐，板缝容差≤3mm；灯槽段2.30m，短端段允许重叠但不缩轴</text><text x="40" y="680">地面板原厚0.134705×1.15，表面z=0；隐藏连续Box碰撞顶面也为0</text><text x="40" y="720">天窗原固定板尺寸2.082×2.300m，装配于跳过的第3/9列；框架负责投影</text><text x="40" y="760">缺件明确：独立玻璃与灯槽属获批新增；无需付费生成，不使用旧被否定墙柱</text></svg>