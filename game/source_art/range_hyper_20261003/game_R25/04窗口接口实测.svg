<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#eef3f5"/><style>text{font:20px sans-serif;fill:#193344}</style><text x="30" y="35">R25 窗梁—上墙板接口实测剖面（横纵绘图比例不同）</text><path d="M250 70V780H950" stroke="#193344" fill="none"/><text x="300" y="825">室内 ← 横向X → 室外；高度为游戏Y（Blender Z），单位m</text><rect x="635" y="80" width="135" height="345" fill="#35495a"/><text x="780" y="120">可见上墙板</text><text x="780" y="155">中心X=13.663，Y=11.50</text><text x="780" y="190">内面X=13.577</text><text x="780" y="225">底10.349，顶12.653</text><rect x="810" y="110" width="130" height="345" fill="#8598a5"/><text x="780" y="480">竖向隐藏封口：中心X=13.883</text><text x="780" y="515">中心高11.30，底10.149</text><rect x="570" y="440" width="240" height="110" fill="#aab9bf"/><text x="280" y="465">原窗梁：中跨顶10.239–10.269</text><text x="280" y="500">封口与梁重叠≥90mm，位于梁后</text><rect x="770" y="590" width="15" height="190" fill="#55c5e0"/><text x="280" y="615">原玻璃位置保持：X=13.749~13.777</text><text x="280" y="650">下6.233，上8.832；厚28.75mm</text><text x="30" y="870">原M04等比模块重复，不拉伸；原M01窗口仅局部精确修切，不重建墙柱。</text></svg>