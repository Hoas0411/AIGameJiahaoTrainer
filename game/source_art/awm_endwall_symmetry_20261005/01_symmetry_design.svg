<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850"><rect width="1400" height="850" fill="#17232d"/><g fill="#edf5fa" font-family="sans-serif"><text x="40" y="55" font-size="30">前后端墙对称修正 / x = 0 为镜像中线</text><text x="40" y="95" font-size="20">以各端墙左半部为基准；右半部连同角部件镜像。尺寸、材质、侧墙和地面保留。</text></g><g stroke="#83e0ef" fill="#344f60" stroke-width="3"><rect x="400" y="170" width="240" height="450" fill="none"/><path d="M400 230 H640 M400 530 H640"/><path d="M520 140 V650" stroke-dasharray="12 8"/><path d="M400 230 L435 260 M640 230 L605 260 M400 530 L435 500 M640 530 L605 500"/><rect x="80" y="710" width="250" height="65"/><rect x="330" y="710" width="250" height="65"/><rect x="720" y="710" width="150" height="65"/><rect x="870" y="710" width="150" height="65"/><rect x="1020" y="710" width="150" height="65"/><rect x="1170" y="710" width="150" height="65"/></g><g fill="white" font-size="21" font-family="sans-serif"><text x="700" y="210">正前方：左 R01 → 右 R01 镜像</text><text x="700" y="255">左前 J01（0°）→ 右前镜像（0°）</text><text x="700" y="365">出生点背后：左侧两块 W01 → 右侧镜像</text><text x="700" y="410">左后 J01（90°）→ 右后镜像（−90°）</text><text x="700" y="515">镜像为等距反射；不拉伸、不简化网格</text><text x="700" y="560">右角碰撞框同步镜像朝向</text><text x="80" y="695">正端墙立面 / 两半对称</text><text x="720" y="695">后端墙立面 / 四块成对对称</text><text x="40" y="820">验收：玩家、回头、近景、正交俯视/斜向、鸟瞰 + 实例/顶点镜像数值核对</text></g></svg>